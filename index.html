<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อเครื่องแต่งกาย | Welfare Factory</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    .fallback {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    .fallback a { color: #2563eb; }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzWFzj_Qwy743_V7jeMlqufsK1n8xQYfCcSCqLIIK2WEeI01C76WealY4zEk87HW6-U4w/exec"
    title="สั่งซื้อเครื่องแต่งกาย"
    id="appFrame">
  </iframe>

  <div class="fallback" id="fallbackMsg">
    <p>ไม่สามารถแสดงหน้าเว็บภายในนี้ได้</p>
    <p><a href="https://script.google.com/macros/s/AKfycbzWFzj_Qwy743_V7jeMlqufsK1n8xQYfCcSCqLIIK2WEeI01C76WealY4zEk87HW6-U4w/exec">คลิกที่นี่เพื่อเปิดหน้าสั่งซื้อโดยตรง</a></p>
  </div>

  <script>
    var frame = document.getElementById('appFrame');
    var fallback = document.getElementById('fallbackMsg');
    var loaded = false;

    frame.addEventListener('load', function () {
      loaded = true;
    });

    setTimeout(function () {
      if (!loaded) {
        frame.style.display = 'none';
        fallback.style.display = 'block';
      }
    }, 4000);
  </script>
</body>
</html>
